#
# USB Wi-Fi drivers built into the ThruRNDIS-Wi-Fi VM image. Every listed
# driver is loaded at boot, so the dongle is ready as soon as it is passed
# through. To support another dongle, add a line and rebuild the image
# (./vm/build.sh, then ./app/build_app.sh, which reuses dist/vm_assets as it
# is); vm/tools/find-driver.sh <vendor:product> tells which module handles a
# USB ID.
#
#   <module> [pkg=<packages>] [files=<patterns>] [newid=<id>/<reference id>]
#
#   module  in-kernel module of the VM's Alpine linux-stable kernel
#   pkg=    Alpine firmware packages, comma separated. Every firmware file the
#           driver declares (modinfo -F firmware) is copied from them.
#   files=  extra firmware patterns under /lib/firmware the driver loads
#           without declaring them, comma separated
#   newid=  USB IDs the kernel's tables do not list yet, each followed by the
#           ID of a supported device with the same chip, comma separated

# Realtek Wi-Fi 6 (rtw89)
rtw89_8851bu  pkg=linux-firmware-rtw89  files=rtw89/rtw8851b_fw*  newid=0bda:b831/0bda:b851
rtw89_8852bu  pkg=linux-firmware-rtw89  files=rtw89/rtw8852b_fw*

# Realtek Wi-Fi 5 / 4 (rtw88): RTL8821CU, RTL8822BU, RTL8822CU, RTL8812AU,
# RTL8821AU, RTL8814AU, RTL8723DU
rtw88_8821cu  pkg=linux-firmware-rtw88
rtw88_8822bu  pkg=linux-firmware-rtw88
rtw88_8822cu  pkg=linux-firmware-rtw88
rtw88_8812au  pkg=linux-firmware-rtw88
rtw88_8821au  pkg=linux-firmware-rtw88
rtw88_8814au  pkg=linux-firmware-rtw88
rtw88_8723du  pkg=linux-firmware-rtw88

# Older Realtek: RTL8188EU/CU/FU/RU, RTL8192CU/EU, RTL8723AU/BU, RTL8710BU
rtl8xxxu      pkg=linux-firmware-rtlwifi

# MediaTek: MT7921AU (Wi-Fi 6), MT7612U, MT7610U, MT7601U
mt7921u       pkg=linux-firmware-mediatek
mt76x2u       pkg=linux-firmware-mediatek
mt76x0u       pkg=linux-firmware-mediatek
mt7601u       pkg=linux-firmware-mediatek

# Ralink RT2870/RT3070/RT3572/RT5370/RT5572
rt2800usb     pkg=linux-firmware-other

# Qualcomm Atheros AR9271, AR7010
ath9k_htc     pkg=linux-firmware-ath9k_htc
